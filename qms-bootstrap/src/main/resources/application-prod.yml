# 生产环境配置 — 所有敏感值通过环境变量注入
# 启动: SPRING_PROFILES_ACTIVE=prod java -jar qms-bootstrap.jar

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qms?stringtype=unspecified&characterEncoding=UTF-8}
    username: ${DB_USER:qms}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: 30000   # 生产库不可用必须快速失败
      maximum-pool-size: 20
      minimum-idle: 4
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ops
    schemas: ops
    baseline-on-migrate: true
    clean-disabled: true              # 生产禁止 clean

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: qms

qms:
  jwt:
    secret: ${QMS_JWT_SECRET}             # 生产必须通过环境变量注入(未设则启动失败)
    expiry: 28800

logging:
  level:
    com.konli.qms: info
    org.springframework: warn
