# 开发环境配置
# 数据库/缓存/对象存储由 docker-compose.yml 一键起(docker compose up -d)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/qms?stringtype=unspecified&characterEncoding=UTF-8
    username: qms
    password: qms
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true                       # stage-1:已生成 V01 地基迁移
    locations: classpath:db/migration
    default-schema: ops
    schemas: ops
    baseline-on-migrate: true
    validate-on-migrate: false          # 临时:db/migration 已重组为 V001~V024 新基线,与库内旧 V01~V230 历史不一致;跳过校验(库 schema 已最新,无 pending migration)

# MinIO 对象存储(stage 后用;前端 .env 已指向 localhost:9000)
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: qms

# JWT(开发默认 secret,可通过 QMS_JWT_SECRET 环境变量覆盖;切勿用于生产)
qms:
  jwt:
    secret: konli-qms-dev-default-secret-change-me-please-32bytes
  # MES 宽表 schema(可用 QMS_MES_SCHEMA 环境变量覆盖)
  mes:
    schema: ${QMS_MES_SCHEMA:qms}

logging:
  level:
    com.konli.qms: debug
    org.springframework: info
